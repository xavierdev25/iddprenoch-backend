# MariaDB 10.11 (la misma versión del hosting, ADR-031) para desarrollo y pruebas de integración.
#   docker compose -f docker-compose.dev.yml up -d
# Puerto 3307 en el host para no chocar con un MySQL o MariaDB instalado localmente en el 3306.
# root (y no un usuario acotado) porque `prisma migrate dev` necesita crear la shadow database.
# La clave se toma de DEV_MYSQL_ROOT_PASSWORD en el .env (docker compose lo lee solo).
services:
  mariadb:
    image: mariadb:10.11
    container_name: iddp-mariadb-dev
    environment:
      MARIADB_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?Define DEV_MYSQL_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: iglesia_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '3307:3306'
    volumes:
      # Volumen distinto al del antiguo contenedor MySQL 8: sus archivos no son compatibles.
      - iddp-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iddp-mariadb-data:
