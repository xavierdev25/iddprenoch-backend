# MySQL 8 para desarrollo local y para las pruebas de integración.
#   docker compose -f docker-compose.dev.yml up -d
# Puerto 3307 en el host para no chocar con un MySQL instalado localmente en el 3306.
# root (y no un usuario acotado) porque `prisma migrate dev` necesita crear la shadow database.
# La clave se toma de DEV_MYSQL_ROOT_PASSWORD en el .env (docker compose lo lee solo).
services:
  mysql:
    image: mysql:8.0
    container_name: iddp-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DEV_MYSQL_ROOT_PASSWORD:?Define DEV_MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: iglesia_dev
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - '3307:3306'
    volumes:
      - iddp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  iddp-mysql-data:
